name: CI

# Beweist die Cross-Platform-Behauptung: baut auf Windows, macOS und Linux
# ein Beispiel-Handout und prueft, dass eine gueltige .docx entsteht.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-sample:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Beispiel-Markdown erzeugen
        shell: bash
        run: |
          cat > sample.md <<'EOF'
          # Testdokument
          ## Untertitel

          > **Merke:** Dies ist ein Merke-Kasten.

          - erster Punkt mit `inline code`
          - zweiter Punkt mit **fett**

          | Sprache | Zweck |
          |---------|-------|
          | Java    | Enterprise |
          | Python  | Skripte |

          ```java
          public class Hallo {
              public static void main(String[] args) {
                  System.out.println("Hallo Welt"); // Kommentar
              }
          }
          ```
          EOF

      - name: Handout bauen (dunkles Theme)
        run: python scripts/build_docx.py sample.md out_dark.docx

      - name: Handout bauen (helles Theme, ohne TOC)
        run: python scripts/build_docx.py sample.md out_light.docx --light --no-toc

      - name: Ergebnis validieren
        run: |
          python -c "from docx import Document; d=Document('out_dark.docx'); assert len(d.tables)>=2, 'zu wenige Tabellen/Code-Boxen'; assert len(d.paragraphs)>0; print('OK:', len(d.paragraphs), 'Absaetze,', len(d.tables), 'Tabellen')"
          python -c "from docx import Document; Document('out_light.docx'); print('light OK')"
